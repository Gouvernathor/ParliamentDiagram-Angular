<app-standard-page>
    <ng-content select="h2" />

    <div id="presentation">
        <ng-content select="presentation" />

        <p>
            Please submit bug reports and feature requests at the project's <a href="https://codeberg.org/Gouvernathor/ParliamentDiagram-Angular/issues">issue tracker</a>.
        </p>
    </div>

    <mat-accordion>
        <mat-expansion-panel>
            <mat-expansion-panel-header>
                <mat-panel-title>Presets</mat-panel-title>
            </mat-expansion-panel-header>

            <!-- (later) query party list from a Commons diagram -->

            <!-- (later) query party list from a country in a list -->

            <ng-content select="presets" />

            <file-drop
                prompt="Drop a diagram here"
                [multiple]="false" [allowedTypes]="['image/svg+xml']"
                [converter]="converter()"
                (preset)="preset.emit($event)"
            />
        </mat-expansion-panel>

        <mat-expansion-panel>
            <mat-expansion-panel-header>
                <mat-panel-title>Advanced parameters</mat-panel-title>
            </mat-expansion-panel-header>

            <ng-content select="advanced-params" />
        </mat-expansion-panel>
    </mat-accordion>

    <div class="partylistarea">
        <ng-content select="partylistarea" />
    </div>

    <button matButton="filled"
        class="diagrammaker"
        [disabled]="!diagramForm().valid()"
        [disabledInteractive]="true"
        (click)="diagramForm().valid() && generateDiagram()"
        [matTooltip]="diagramForm().errorSummary().map(e => e.message).join('\n')"
    >
        Make my diagram
    </button>

    @if (diagramForm().dirty() && diagramForm().errorSummary().length) {
        <div class="errorcontainer">
            @for (error of diagramForm().errorSummary(); track $index) {
                <p>{{error.message}}</p>
            }
        </div>
    }

    @if (diagrams().length) {
        <app-diagrams-list [diagrams]="diagrams()" />
    }
</app-standard-page>
