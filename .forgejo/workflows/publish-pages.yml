on:
  push:

jobs:
  publish:
    name: "Publish to Codeberg Pages"
    if: ${{ forgejo.ref_name == forgejo.event.repository.default_branch }}

    runs-on: codeberg-small

    env:
      BUILD_LOC: dist/ParliamentDiagram/browser

    steps:
      - uses: actions/checkout@v7
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build --if-present

      # redirects
      - run: cp ./codeberg_pages_redirects ${{ env.BUILD_LOC }}/_redirects

      # compress the files
      - run: find $BUILD_LOC -type f -regex '.*\.\(htm\|html\|xml\|txt\|text\|js\|css\|svg\)$' -exec gzip -f -k {} \;
      - run: find $BUILD_LOC -type f -regex '.*\.\(htm\|html\|xml\|txt\|text\|js\|css\|svg\)$' -exec brotli -f -k {} \;

      - uses: actions/git-pages@v2
        with:
          site: https://parliamentdiagram.gouvernathor.fr/
          server: codeberg.page
          token: ${{ forge.token }}
          source: ${{ env.BUILD_LOC }}/
